<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | VELORA</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        VELORA<span>.</span>
      </a>

      <ul class="nav-links" id="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="shop.html" class="nav-link">Shop</a></li>
      </ul>

      <div class="nav-actions">
        <a href="cart.html" class="icon-btn" title="Shopping Cart">
          <i class="fas fa-shopping-bag"></i>
          <span class="badge-count" id="cart-count-badge" style="display: none;">0</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- Register Auth Card -->
  <section class="section-padding">
    <div class="auth-container" style="max-width: 580px;">
      <h1 class="auth-title">CREATE YOUR ACCOUNT</h1>
      <p class="auth-sub">Join VELORA for exclusive fashion access and seamless checkout</p>

      <div id="register-alert" style="display: none; margin-bottom: 1rem; padding: 0.75rem; border-radius: var(--radius-sm); font-size: 0.85rem; background: #ffe3e3; color: var(--danger); border: 1px solid #ffa8a8;"></div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name <span style="color: var(--danger);">*</span></label>
          <input type="text" id="reg-name" class="form-control" placeholder="e.g. Zara Ahmed" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address <span style="color: var(--danger);">*</span></label>
            <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-phone">Phone Number <span style="color: var(--danger);">*</span></label>
            <input type="tel" id="reg-phone" class="form-control" placeholder="+92 300 1234567" required>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="reg-password">Password <span style="color: var(--danger);">*</span></label>
            <input type="password" id="reg-password" class="form-control" placeholder="Min 6 characters" minlength="6" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-confirm-password">Confirm Password <span style="color: var(--danger);">*</span></label>
            <input type="password" id="reg-confirm-password" class="form-control" placeholder="Re-enter password" required>
          </div>
        </div>

        <h4 style="font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.08em; margin: 1rem 0 0.75rem; border-top: 1px solid var(--border-color); padding-top: 1rem;">Default Shipping Address (Optional)</h4>

        <div class="form-group">
          <label class="form-label" for="reg-street">Street Address</label>
          <input type="text" id="reg-street" class="form-control" placeholder="House #, Street name, Area">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="reg-city">City</label>
            <input type="text" id="reg-city" class="form-control" placeholder="e.g. Lahore / Karachi">
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-district">District / Region</label>
            <input type="text" id="reg-district" class="form-control" placeholder="District">
          </div>
        </div>

        <button type="submit" id="reg-btn" class="btn btn-primary btn-block" style="padding: 0.9rem; margin-top: 1rem;">
          REGISTER ACCOUNT <i class="fas fa-arrow-right"></i>
        </button>
      </form>

      <div style="margin-top: 2rem; text-align: center; font-size: 0.9rem; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 1.5rem;">
        Already have a VELORA account? <a href="login.html" style="color: var(--primary); font-weight: 600; text-decoration: underline;">Sign In</a>
      </div>
    </div>
  </section>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (isAuthenticated()) {
        window.location.href = 'index.html';
      }

      const form = document.getElementById('register-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const name = document.getElementById('reg-name').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const phone = document.getElementById('reg-phone').value.trim();
        const password = document.getElementById('reg-password').value;
        const confirmPassword = document.getElementById('reg-confirm-password').value;

        const alertEl = document.getElementById('register-alert');
        const submitBtn = document.getElementById('reg-btn');

        alertEl.style.display = 'none';

        if (password !== confirmPassword) {
          alertEl.textContent = 'Passwords do not match. Please verify.';
          alertEl.style.display = 'block';
          return;
        }

        const address = {
          street: document.getElementById('reg-street').value.trim(),
          city: document.getElementById('reg-city').value.trim(),
          district: document.getElementById('reg-district').value.trim()
        };

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';

        try {
          const res = await apiRequest('/auth/register', 'POST', {
            name, email, phone, password, address
          });

          if (res.success && res.data.token) {
            setAuthSession(res.data.token, res.data);
            showToast('Account created successfully!', 'success');
            setTimeout(() => {
              window.location.href = 'index.html';
            }, 800);
          }
        } catch (err) {
          alertEl.textContent = err.message || 'Registration failed';
          alertEl.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'REGISTER ACCOUNT <i class="fas fa-arrow-right"></i>';
        }
      });
    });
  </script>
</body>
</html>
