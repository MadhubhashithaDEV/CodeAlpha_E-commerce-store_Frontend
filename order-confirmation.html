<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmation | VELORA</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        VELORA<span>.</span>
      </a>

      <ul class="nav-links" id="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="shop.html" class="nav-link">Shop</a></li>
      </ul>

      <div class="nav-actions">
        <div id="nav-user-menu"></div>
      </div>
    </div>
  </nav>

  <!-- Confirmation Section -->
  <section class="section-padding container">
    <div id="confirmation-content" style="max-width: 750px; margin: 0 auto; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 3rem; box-shadow: var(--shadow-md);">
      <div style="text-align: center;">
        <i class="fas fa-spinner fa-spin fa-3x" style="color: var(--accent);"></i>
        <p style="margin-top: 1rem;">Loading order confirmation details...</p>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="border: none; padding: 0;">
        <p>&copy; 2026 VELORA Clothing Store. CodeAlpha Full Stack Internship Submission.</p>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const orderId = urlParams.get('id');

      if (!orderId) {
        window.location.href = 'orders.html';
        return;
      }

      const container = document.getElementById('confirmation-content');

      try {
        const res = await apiRequest(`/orders/${orderId}`, 'GET', null, true);

        if (res.success && res.data) {
          const o = res.data;
          const orderDate = new Date(o.createdAt).toLocaleDateString('en-US', {
            year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
          });

          container.innerHTML = `
            <div style="text-align: center; border-bottom: 1px solid var(--border-color); padding-bottom: 2rem; margin-bottom: 2rem;">
              <div style="width: 70px; height: 70px; background: var(--accent-light); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1rem;">
                <i class="fas fa-check" style="font-size: 2rem; color: var(--accent);"></i>
              </div>
              <h1 style="font-size: 2rem; margin-bottom: 0.5rem; color: var(--primary);">ORDER PLACED SUCCESSFULLY!</h1>
              <p style="color: var(--text-muted);">Thank you for shopping with VELORA. Your order has been registered.</p>
              
              <div style="display: inline-block; background: var(--bg-subtle); padding: 0.5rem 1.5rem; border-radius: 20px; font-weight: 700; margin-top: 1rem; color: var(--primary);">
                ORDER #${o.orderNumber}
              </div>
            </div>

            <!-- Order Info Grid -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 2rem; font-size: 0.9rem;">
              <div>
                <h4 style="text-transform: uppercase; color: var(--text-muted); font-size: 0.75rem; letter-spacing: 0.1em; margin-bottom: 0.5rem;">Delivery Address</h4>
                <strong>${o.shippingAddress.fullName}</strong><br>
                ${o.shippingAddress.address}<br>
                ${o.shippingAddress.city}, ${o.shippingAddress.district || ''}<br>
                Phone: ${o.shippingAddress.phone}
              </div>

              <div>
                <h4 style="text-transform: uppercase; color: var(--text-muted); font-size: 0.75rem; letter-spacing: 0.1em; margin-bottom: 0.5rem;">Order Details</h4>
                <strong>Date:</strong> ${orderDate}<br>
                <strong>Payment Method:</strong> ${o.paymentMethod}<br>
                <strong>Status:</strong> <span style="color: var(--success); font-weight: 700;">${o.status}</span>
              </div>
            </div>

            <!-- Items Breakdown -->
            <h4 style="text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 1rem; font-size: 0.95rem;">Purchased Items</h4>
            <div style="display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem;">
              ${o.items.map(item => `
                <div style="display: grid; grid-template-columns: 60px 1fr auto; gap: 1rem; align-items: center; border-bottom: 1px dashed var(--border-color); padding-bottom: 0.75rem;">
                  <img src="${item.image}" alt="${item.productName}" style="width: 60px; height: 75px; object-fit: cover; border-radius: 4px;">
                  <div>
                    <strong style="font-size: 0.95rem;">${item.productName}</strong>
                    <div style="font-size: 0.8rem; color: var(--text-muted);">Size: ${item.size} | Color: ${item.color} | Qty: ${item.quantity}</div>
                  </div>
                  <div style="font-weight: 700;">Rs. ${(item.price * item.quantity).toLocaleString()}</div>
                </div>
              `).join('')}
            </div>

            <!-- Totals -->
            <div style="background: var(--bg-subtle); padding: 1.25rem; border-radius: var(--radius-sm); margin-bottom: 2.5rem; font-size: 0.9rem;">
              <div style="display: flex; justify-content: space-between; margin-bottom: 0.4rem;">
                <span>Subtotal</span>
                <span>Rs. ${o.subtotal.toLocaleString()}</span>
              </div>
              <div style="display: flex; justify-content: space-between; margin-bottom: 0.4rem;">
                <span>Shipping</span>
                <span>${o.shippingCost === 0 ? 'FREE' : `Rs. ${o.shippingCost.toLocaleString()}`}</span>
              </div>
              <div style="display: flex; justify-content: space-between; font-size: 1.15rem; font-weight: 700; border-top: 1px solid var(--border-color); padding-top: 0.6rem;">
                <span>Grand Total</span>
                <span style="color: var(--primary);">Rs. ${o.total.toLocaleString()}</span>
              </div>
            </div>

            <!-- Buttons -->
            <div style="display: flex; gap: 1rem;">
              <a href="orders.html" class="btn btn-primary" style="flex: 1;">VIEW MY ORDERS</a>
              <a href="shop.html" class="btn btn-secondary" style="flex: 1;">CONTINUE SHOPPING</a>
            </div>
          `;
        }
      } catch (err) {
        container.innerHTML = `
          <div style="text-align: center; color: var(--danger);">
            <h2>Failed to load order confirmation</h2>
            <p style="margin-top: 0.5rem; color: var(--text-muted);">${err.message}</p>
            <a href="orders.html" class="btn btn-primary" style="margin-top: 1.5rem;">Go to My Orders</a>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
