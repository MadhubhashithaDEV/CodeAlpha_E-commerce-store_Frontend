<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account Profile | VELORA</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

  <!-- Announcement Bar -->
  <div class="announcement-bar">
    <i class="fas fa-truck-fast"></i> FREE SHIPPING ON ALL ORDERS OVER RS. 10,000
  </div>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container nav-container">
      <button class="mobile-menu-toggle" id="mobile-menu-btn" aria-label="Toggle menu">
        <i class="fas fa-bars"></i>
      </button>

      <a href="index.html" class="brand-logo">
        Hiruu<span>.</span>
      </a>

      <ul class="nav-links" id="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="shop.html" class="nav-link">Shop</a></li>
        <li><a href="orders.html" class="nav-link">My Orders</a></li>
      </ul>

      <div class="nav-actions">
        <div id="nav-user-menu"></div>
        <a href="cart.html" class="icon-btn" title="Shopping Cart">
          <i class="fas fa-shopping-bag"></i>
          <span class="badge-count" id="cart-count-badge" style="display: none;">0</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- Profile Section -->
  <section class="section-padding container">
    <div
      style="max-width: 650px; margin: 0 auto; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 2.5rem; box-shadow: var(--shadow-md);">

      <div
        style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 1.5rem; margin-bottom: 2rem;">
        <div>
          <h1 style="font-size: 1.8rem; margin: 0; color: var(--primary);">MY PROFILE</h1>
          <p style="color: var(--text-muted); font-size: 0.85rem; margin: 0.25rem 0 0;">Manage your contact details and
            default shipping address</p>
        </div>
        <span id="role-badge"
          style="background: var(--accent-light); color: var(--accent); padding: 0.4rem 1rem; border-radius: 20px; font-weight: 700; font-size: 0.75rem; text-transform: uppercase;">
          CUSTOMER
        </span>
      </div>

      <div id="profile-alert"
        style="display: none; margin-bottom: 1.5rem; padding: 0.85rem; border-radius: var(--radius-sm); font-size: 0.85rem;">
      </div>

      <form id="profile-form">
        <div class="form-group">
          <label class="form-label" for="prof-name">Full Name</label>
          <input type="text" id="prof-name" class="form-control" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="prof-email">Email Address (Read-only)</label>
            <input type="email" id="prof-email" class="form-control" style="background: var(--bg-subtle);" readonly>
          </div>

          <div class="form-group">
            <label class="form-label" for="prof-phone">Phone Number</label>
            <input type="tel" id="prof-phone" class="form-control">
          </div>
        </div>

        <h4
          style="font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.08em; margin: 1.5rem 0 1rem; border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
          Default Shipping Address</h4>

        <div class="form-group">
          <label class="form-label" for="prof-street">Street Address</label>
          <input type="text" id="prof-street" class="form-control" placeholder="House #, Street name">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="prof-city">City</label>
            <input type="text" id="prof-city" class="form-control" placeholder="City">
          </div>

          <div class="form-group">
            <label class="form-label" for="prof-district">District / Region</label>
            <input type="text" id="prof-district" class="form-control" placeholder="District">
          </div>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
          <button type="submit" id="save-profile-btn" class="btn btn-primary btn-block" style="padding: 0.9rem;">
            SAVE CHANGES <i class="fas fa-save"></i>
          </button>
          <button type="button" onclick="logoutUser()" class="btn btn-secondary"
            style="color: var(--danger); border-color: var(--danger);">
            LOGOUT
          </button>
        </div>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="border: none; padding: 0;">
        <p>&copy; 2026 VELORA Clothing Store. CodeAlpha Full Stack Internship Submission.</p>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!isAuthenticated()) {
        window.location.href = 'login.html?redirect=profile.html';
        return;
      }

      await fetchProfileData();

      document.getElementById('profile-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const alertEl = document.getElementById('profile-alert');
        const saveBtn = document.getElementById('save-profile-btn');

        alertEl.style.display = 'none';
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

        const updateData = {
          name: document.getElementById('prof-name').value.trim(),
          phone: document.getElementById('prof-phone').value.trim(),
          address: {
            street: document.getElementById('prof-street').value.trim(),
            city: document.getElementById('prof-city').value.trim(),
            district: document.getElementById('prof-district').value.trim()
          }
        };

        try {
          const res = await apiRequest('/users/profile', 'PUT', updateData, true);

          if (res.success && res.data) {
            // Update stored user details in localStorage
            const token = getAuthToken();
            setAuthSession(token, res.data);

            showToast('Profile updated successfully!', 'success');
            alertEl.style.background = '#d3f9d8';
            alertEl.style.color = 'var(--success)';
            alertEl.style.border = '1px solid #b2f2bb';
            alertEl.textContent = 'Your profile details have been saved successfully.';
            alertEl.style.display = 'block';

            updateNavAuthUI();
          }
        } catch (err) {
          alertEl.style.background = '#ffe3e3';
          alertEl.style.color = 'var(--danger)';
          alertEl.style.border = '1px solid #ffa8a8';
          alertEl.textContent = err.message || 'Failed to update profile';
          alertEl.style.display = 'block';
        } finally {
          saveBtn.disabled = false;
          saveBtn.innerHTML = 'SAVE CHANGES <i class="fas fa-save"></i>';
        }
      });
    });

    async function fetchProfileData() {
      try {
        const res = await apiRequest('/users/profile', 'GET', null, true);

        if (res.success && res.data) {
          const u = res.data;
          document.getElementById('prof-name').value = u.name || '';
          document.getElementById('prof-email').value = u.email || '';
          document.getElementById('prof-phone').value = u.phone || '';
          document.getElementById('role-badge').textContent = (u.role || 'USER').toUpperCase();

          if (u.address) {
            document.getElementById('prof-street').value = u.address.street || '';
            document.getElementById('prof-city').value = u.address.city || '';
            document.getElementById('prof-district').value = u.address.district || '';
          }
        }
      } catch (err) {
        showToast('Failed to load profile details', 'error');
      }
    }
  </script>
</body>

</html>
