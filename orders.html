<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders | VELORA</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Announcement Bar -->
  <div class="announcement-bar">
    <i class="fas fa-truck-fast"></i> FREE SHIPPING ON ALL ORDERS OVER RS. 10,000
  </div>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container nav-container">
      <button class="mobile-menu-toggle" id="mobile-menu-btn" aria-label="Toggle menu">
        <i class="fas fa-bars"></i>
      </button>

      <a href="index.html" class="brand-logo">
        VELORA<span>.</span>
      </a>

      <ul class="nav-links" id="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="shop.html" class="nav-link">Shop</a></li>
        <li><a href="profile.html" class="nav-link">My Profile</a></li>
      </ul>

      <div class="nav-actions">
        <div id="nav-user-menu"></div>
        <a href="cart.html" class="icon-btn" title="Shopping Cart">
          <i class="fas fa-shopping-bag"></i>
          <span class="badge-count" id="cart-count-badge" style="display: none;">0</span>
        </a>
      </div>
    </div>
  </nav>

  <!-- Orders Header -->
  <div style="background-color: var(--bg-subtle); padding: 2.5rem 0; text-align: center; border-bottom: 1px solid var(--border-color);">
    <div class="container">
      <h1 class="section-title">MY ORDERS</h1>
      <p class="section-subtitle" style="margin-bottom: 0;">Track and review your past purchases</p>
    </div>
  </div>

  <!-- Orders List -->
  <section class="section-padding container">
    <div id="orders-list-container">
      <div style="text-align: center; padding: 4rem; color: var(--text-muted);">
        <i class="fas fa-spinner fa-spin fa-3x"></i>
        <p style="margin-top: 1rem;">Loading your order history...</p>
      </div>
    </div>
  </section>

  <!-- Order Detail Modal -->
  <div class="modal-backdrop" id="order-detail-modal">
    <div class="modal-content" style="max-width: 650px;">
      <button class="modal-close" onclick="closeOrderModal()">&times;</button>
      <div id="order-modal-body"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="border: none; padding: 0;">
        <p>&copy; 2026 VELORA Clothing Store. CodeAlpha Full Stack Internship Submission.</p>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>

  <script>
    let userOrders = [];

    document.addEventListener('DOMContentLoaded', async () => {
      if (!isAuthenticated()) {
        showToast('Please log in to view your order history', 'info');
        setTimeout(() => window.location.href = 'login.html?redirect=orders.html', 1000);
        return;
      }

      await loadMyOrders();
    });

    async function loadMyOrders() {
      const container = document.getElementById('orders-list-container');
      if (!container) return;

      try {
        const res = await apiRequest('/orders/my-orders', 'GET', null, true);

        if (res.success && res.data) {
          userOrders = res.data;

          if (userOrders.length === 0) {
            container.innerHTML = `
              <div style="text-align: center; padding: 5rem 1rem; background: var(--bg-surface); border-radius: var(--radius-md); border: 1px solid var(--border-color);">
                <i class="fas fa-box-open fa-4x" style="color: var(--text-light); margin-bottom: 1.5rem;"></i>
                <h2>No Orders Placed Yet</h2>
                <p style="color: var(--text-muted); margin: 0.5rem 0 2rem;">You haven't placed any fashion orders with VELORA yet.</p>
                <a href="shop.html" class="btn btn-primary">EXPLORE COLLECTION</a>
              </div>
            `;
            return;
          }

          container.innerHTML = `
            <div style="display: flex; flex-direction: column; gap: 1.5rem; max-width: 900px; margin: 0 auto;">
              ${userOrders.map(o => {
                const dateStr = new Date(o.createdAt).toLocaleDateString('en-US', {
                  year: 'numeric', month: 'short', day: 'numeric'
                });

                let statusBg = '#e6fcf5', statusColor = '#0ca678';
                if (o.status === 'Pending') { statusBg = '#fff9db'; statusColor = '#f59f00'; }
                if (o.status === 'Cancelled') { statusBg = '#ffe3e3'; statusColor = '#e03131'; }

                return `
                  <div style="background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem;">
                      <div>
                        <strong style="font-size: 1.1rem; color: var(--primary);">ORDER #${o.orderNumber}</strong>
                        <span style="font-size: 0.85rem; color: var(--text-muted); margin-left: 1rem;">Placed on ${dateStr}</span>
                      </div>

                      <span style="background: ${statusBg}; color: ${statusColor}; padding: 0.3rem 0.8rem; border-radius: 20px; font-weight: 700; font-size: 0.8rem; text-transform: uppercase;">
                        ${o.status}
                      </span>
                    </div>

                    <div style="display: flex; gap: 1rem; align-items: center; overflow-x: auto; padding: 0.5rem 0;">
                      ${o.items.map(item => `
                        <div style="display: flex; align-items: center; gap: 0.75rem; flex-shrink: 0; background: var(--bg-subtle); padding: 0.5rem 0.75rem; border-radius: var(--radius-sm);">
                          <img src="${item.image}" alt="${item.productName}" style="width: 45px; height: 55px; object-fit: cover; border-radius: 4px;">
                          <div style="font-size: 0.8rem;">
                            <div style="font-weight: 600;">${item.productName}</div>
                            <div style="color: var(--text-muted);">Size: ${item.size} × ${item.quantity}</div>
                          </div>
                        </div>
                      `).join('')}
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 1rem; margin-top: 0.5rem;">
                      <div>
                        <span style="font-size: 0.85rem; color: var(--text-muted);">Total Amount:</span>
                        <strong style="font-size: 1.15rem; color: var(--primary); margin-left: 0.5rem;">Rs. ${o.total.toLocaleString()}</strong>
                      </div>

                      <button onclick="viewOrderDetails('${o._id}')" class="btn btn-secondary btn-sm">
                        View Order Details <i class="fas fa-chevron-right"></i>
                      </button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `;
        }
      } catch (err) {
        container.innerHTML = `
          <div style="text-align: center; color: var(--danger);">
            <p>Failed to load orders. ${err.message}</p>
          </div>
        `;
      }
    }

    function viewOrderDetails(orderId) {
      const o = userOrders.find(item => item._id === orderId);
      if (!o) return;

      const modal = document.getElementById('order-detail-modal');
      const body = document.getElementById('order-modal-body');

      body.innerHTML = `
        <h2 style="font-size: 1.35rem; margin-bottom: 0.25rem;">ORDER #${o.orderNumber}</h2>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem;">Placed on ${new Date(o.createdAt).toLocaleString()}</p>

        <div style="background: var(--bg-subtle); padding: 1rem; border-radius: var(--radius-sm); margin-bottom: 1.5rem; font-size: 0.85rem;">
          <strong>Shipping Address:</strong><br>
          ${o.shippingAddress.fullName} (${o.shippingAddress.phone})<br>
          ${o.shippingAddress.address}, ${o.shippingAddress.city}, ${o.shippingAddress.district || ''}
        </div>

        <h4 style="text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 1rem; font-size: 0.9rem;">Ordered Items</h4>
        <div style="display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem;">
          ${o.items.map(item => `
            <div style="display: flex; gap: 1rem; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem; font-size: 0.85rem;">
              <img src="${item.image}" alt="${item.productName}" style="width: 50px; height: 60px; object-fit: cover; border-radius: 4px;">
              <div style="flex-grow: 1;">
                <strong>${item.productName}</strong>
                <div style="color: var(--text-muted); font-size: 0.75rem;">Size: ${item.size} | Color: ${item.color}</div>
              </div>
              <div>${item.quantity} × Rs. ${item.price.toLocaleString()}</div>
              <div style="font-weight: 700;">Rs. ${(item.price * item.quantity).toLocaleString()}</div>
            </div>
          `).join('')}
        </div>

        <div style="display: flex; justify-content: space-between; font-weight: 700; font-size: 1.1rem; border-top: 2px solid var(--border-color); padding-top: 0.75rem;">
          <span>Total Paid (${o.paymentMethod})</span>
          <span style="color: var(--primary);">Rs. ${o.total.toLocaleString()}</span>
        </div>
      `;

      modal.classList.add('open');
    }

    function closeOrderModal() {
      document.getElementById('order-detail-modal').classList.remove('open');
    }
  </script>
</body>
</html>
